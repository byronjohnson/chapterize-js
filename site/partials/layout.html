<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
{{robots}}<link rel="canonical" href="{{url}}">
<meta name="theme-color" content="#07080c">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{display}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{url}}">
<meta name="twitter:card" content="summary">
<link rel="stylesheet" href="{{css}}">
{{head}}</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <div class="top-in">
    <a class="brand" href="/"><span class="brand-dot" aria-hidden="true"></span>{{display}}<span class="ver">v{{version}}</span></a>
    <nav class="top-links" aria-label="Primary">
      {{nav}}
      <a class="top-gh" href="{{repo}}" rel="noopener">GitHub</a>
    </nav>
  </div>
  <div class="progress" aria-hidden="true"><i></i></div>
</header>
{{content}}
<p id="copy-live" class="sr" aria-live="polite"></p>
<footer class="foot">
  <p>{{display}} v{{version}} · MIT © Byron Johnson · zero dependencies</p>
  <ul>
    <li><a href="/frameworks">Frameworks</a></li>
    <li><a href="/markers">Markers</a></li>
    <li><a href="/plain">Plain example</a></li>
    <li><a href="{{repo}}">GitHub</a></li>
    <li><a href="/llms.txt">llms.txt</a></li>
  </ul>
</footer>
{{scripts}}</body>
</html>
